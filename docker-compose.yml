services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: support_triage
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://support:support@postgres:5432/support_triage
      USE_MOCK_AI: "true"
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
      FAQ_DIRECTORY: /app/data/faqs
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/data/chroma
    depends_on:
      - postgres

  ui:
    build: .
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  postgres_data:
  chroma_data:

